[project]
name = "rtl-buddy-xeno"
dynamic = ["version"]
description = "SystemVerilog AST-mutation corpus generator. Source-level CDC-aware and FPV-aware mutations for fuzzer and mutation-testing harnesses."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Loh Zhi-Hern", email = "expsg-hern@users.noreply.github.com" }
]
keywords = [
    "systemverilog",
    "verilog",
    "rtl",
    "mutation-testing",
    "fuzzing",
    "cdc",
    "clock-domain-crossing",
    "eda",
    "asic",
    "fpga",
    "verification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# Runtime closure intentionally empty. The bundled CLOCK_POLARITY_SWAP
# operator is a regex-based token rewrite that needs no SV parser; every
# other operator pulls its parser in via the `[verible]` and/or `[slang]`
# extras below — see #4 (parser layering) for the per-operator picks.
dependencies = []

[project.optional-dependencies]
# Verible CST substrate (via rtl-buddy-view's public helpers — view#109).
# Required by ATTRIBUTE_TOGGLE, ASSIGN_DROP, and every other operator that
# needs to walk the SV source structurally. The `cst.py` facade lazy-
# imports this so the no-extras install path stays working (only
# CLOCK_POLARITY_SWAP runs without `[verible]`).
verible = [
    # Floor at 0.2.1: the first PyPI release. The v0.2.0 git tag predates
    # the include-dir filelist fix and ships no prebuilt SPA.
    "rtl-buddy-view>=0.2.1,<0.3.0",
]
# Pyslang elaboration. Required by the four operators that need semantic
# context (sync-chain identification, bit-extract slice width, reset-chain
# head, state-bearing-assignment classification). Also lazy-imported via
# the `slang.py` facade.
slang = [
    "pyslang>=10,<11",
]

[project.urls]
"Homepage" = "https://github.com/rtl-buddy/rtl-buddy-xeno"
"Source" = "https://github.com/rtl-buddy/rtl-buddy-xeno"
"Issues" = "https://github.com/rtl-buddy/rtl-buddy-xeno/issues"
"Releases" = "https://github.com/rtl-buddy/rtl-buddy-xeno/releases"
"Design (Stage 3)" = "https://github.com/rtl-buddy/rtl-buddy-cdc/issues/221"
"Design (Stage 4)" = "https://github.com/rtl-buddy/rtl-buddy-cdc/issues/222"

# hatchling + hatch-vcs derive the version from the git tag — required
# by the release-on-merge workflow, which pushes the tag and builds from
# it in the same run (same setup as rtl_buddy).
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/rtl_buddy_xeno"]

[tool.hatch.build.targets.sdist]
include = [
  "src/rtl_buddy_xeno",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[dependency-groups]
lint = [
    "mypy>=2.1.0",
    "ruff>=0.11.0",
]
test = [
    "pytest>=9.0.3",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E7", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/rtl_buddy_xeno"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyslang.*"
ignore_missing_imports = true
follow_imports = "skip"
