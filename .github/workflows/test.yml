name: Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'tests/fixtures/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'tests/fixtures/**'

# Pinned to match the viewer's vendored binary — the `rtl-buddy-sch`
# distribution, renamed from `rtl-buddy-view` at 0.7.0 (sch#157); the
# import package it ships did not rename, so the tag still lives in
# src/rtl_buddy_view/_verible_install.py (view#109). Rotate in lockstep
# when bumping the viewer's pin.
env:
  VERIBLE_VERSION: "v0.0-4053-g89d4d98a"

jobs:
  pytest:
    name: pytest — py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Pull in everything: the test group plus both optional-deps
      # (`[verible]` for the cst.py facade and ASSIGN_DROP; `[slang]`
      # for the pyslang elaboration gate in test_mutant_validity.py).
      # The validity test skips gracefully if Verible isn't on PATH,
      # so a missing binary doesn't fail CI — but we install it below
      # to actually exercise the gate.
      - name: Install test + all extras
        run: uv sync --group test --all-extras --python ${{ matrix.python-version }}

      # Cache the Verible binary keyed on the pinned version above so
      # we pay the download cost once per version bump, not once per
      # CI run. Verible's prebuilt releases live under
      # github.com/chipsalliance/verible/releases.
      - name: Cache Verible
        id: cache-verible
        uses: actions/cache@v4
        with:
          path: vendor/verible
          key: verible-${{ runner.os }}-${{ env.VERIBLE_VERSION }}

      - name: Install Verible (cache miss only)
        if: steps.cache-verible.outputs.cache-hit != 'true'
        run: |
          mkdir -p vendor/verible
          url="https://github.com/chipsalliance/verible/releases/download/${VERIBLE_VERSION}/verible-${VERIBLE_VERSION}-linux-static-x86_64.tar.gz"
          curl -sSL "$url" | tar xz -C vendor/verible --strip-components=1
          ls vendor/verible/bin

      - name: Add Verible to PATH
        run: echo "$(pwd)/vendor/verible/bin" >> $GITHUB_PATH

      - name: Verify Verible is on PATH
        run: verible-verilog-syntax --version

      - name: Run pytest
        run: uv run --python ${{ matrix.python-version }} pytest -q
