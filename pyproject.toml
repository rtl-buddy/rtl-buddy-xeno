[project]
name = "rtl-buddy-xeno"
version = "0.0.1"
description = "SystemVerilog AST-mutation corpus generator. Source-level CDC-aware and FPV-aware mutations for fuzzer and mutation-testing harnesses."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
    { name = "Loh Zhi-Hern", email = "expsg-hern@users.noreply.github.com" }
]
keywords = [
    "systemverilog",
    "verilog",
    "rtl",
    "mutation-testing",
    "fuzzing",
    "cdc",
    "clock-domain-crossing",
    "eda",
    "asic",
    "fpga",
    "verification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# Runtime closure intentionally empty. The bundled CLOCK_POLARITY_SWAP
# operator is a regex-based token rewrite that needs no SV parser; every
# other operator pulls its parser in via the `[verible]` and/or `[slang]`
# extras below — see #4 (parser layering) for the per-operator picks.
dependencies = []

[project.optional-dependencies]
# Verible CST substrate (via rtl-buddy-view's public helpers — view#109).
# Required by ATTRIBUTE_TOGGLE, ASSIGN_DROP, and every other operator that
# needs to walk the SV source structurally. The `cst.py` facade lazy-
# imports this so the no-extras install path stays working (only
# CLOCK_POLARITY_SWAP runs without `[verible]`).
verible = [
    "rtl-buddy-view>=0.2.0,<0.3.0",
]
# Pyslang elaboration. Required by the four operators that need semantic
# context (sync-chain identification, bit-extract slice width, reset-chain
# head, state-bearing-assignment classification). Also lazy-imported via
# the `slang.py` facade.
slang = [
    "pyslang>=10,<11",
]

[project.urls]
"Homepage" = "https://github.com/rtl-buddy/rtl-buddy-xeno"
"Source" = "https://github.com/rtl-buddy/rtl-buddy-xeno"
"Issues" = "https://github.com/rtl-buddy/rtl-buddy-xeno/issues"
"Releases" = "https://github.com/rtl-buddy/rtl-buddy-xeno/releases"
"Design (Stage 3)" = "https://github.com/rtl-buddy/rtl-buddy-cdc/issues/221"
"Design (Stage 4)" = "https://github.com/rtl-buddy/rtl-buddy-cdc/issues/222"

# rtl-buddy-view is not on PyPI today; the `[verible]` extra resolves via
# a GitHub git source for local development until view publishes. The
# version constraint in [project.optional-dependencies] (>=0.2.0,<0.3.0)
# still applies. This [tool.uv.sources] block is read by uv during
# development and is NOT included in the published wheel's metadata — so
# once view is on PyPI, PyPI consumers resolve cleanly via the version
# constraint alone; this block can be deleted from this file in the same
# change that lands view's first published release.
[tool.uv.sources]
rtl-buddy-view = { git = "https://github.com/rtl-buddy/rtl-buddy-view.git", tag = "v0.2.0" }

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
lint = [
    "mypy>=2.1.0",
    "ruff>=0.11.0",
]
test = [
    "pytest>=9.0.3",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E7", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["src/rtl_buddy_xeno"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyslang.*"
ignore_missing_imports = true
follow_imports = "skip"
